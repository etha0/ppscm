# Packaged into WEB-INF/classes/application.properties in scm.war.
# Common settings. Build with mvn clean package -Pdev (default) or -Pprod.
# Priority: environment variables > SCM_CONFIG file > profile file > this file.
SCM_DB_INIT=false
SCM_BOOTSTRAP_USERNAME=admin
SCM_BOOTSTRAP_PASSWORD=
# Temporary diagnosis only: logs the effective DB password in plaintext once per Database instance.
SCM_DB_LOG_CREDENTIALS=false
# Image storage directory. Required for web image uploads and legacy DB migration.
# Example: D:/uploadfiles/images or /home/ppscm/uploadfiles/images
# All images use PRODUCT_CODE_1.JPG through PRODUCT_CODE_6.JPG; no image bytes are stored in DB.
SCM_UPLOAD_IMAGES_DIR=
